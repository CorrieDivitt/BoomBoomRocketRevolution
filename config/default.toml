# Codegen overrides for default.xex (included from boomboomrocket_manifest.toml).
# Addresses verified against the decrypted image; see docs/ANALYSIS.md.

# CRT setjmp/longjmp, used by libjpeg/libpng error handling. Without these the
# recompiled longjmp just returns into the failing code with garbage registers
# (crash reading 0x1A4 in the JPEG marker reader right after the EA logo).
setjmp_address  = 0x82167220
longjmp_address = 0x821675A0

[functions]
# Small functions missing from .pdata that are only reached by branches from
# C++ this-adjustor thunks ("addi r3,r3,+-N ; b target"), so analysis can't size them.
0x8213E798 = { size = 0x14 }  # addi r11,r3,4 / lwz / addi / stw / blr  (refcount increment)
0x8213F0D0 = { size = 0x28 }  # stores three vtable pointers into r3 then blr
0x8214A788 = { size = 0x08 }  # thunk: addi r3,r3,4 ; b 0x8213F718

# Functions only reached through function pointers (not via direct calls), so
# analysis never emitted them. Found by scanning lis/addi address pairs and data
# words that point into .text, then checking each for a real function start.
0x8216A430 = { size = 0x04 }  # b KeTlsAlloc (CRT TLS init, called via pointer) - first boot crash
0x821955D8 = { size = 0x0C }  # static initializer: lis/addi r3 ; b 0x820C4F18
0x82120AC0 = { size = 0x18 }  # small setter, ends in blr
0x8214CFD8 = { end = 0x8214D020 }  # four adjacent vtable methods, each ends in mtctr/bctr
0x8214D020 = { end = 0x8214D068 }
0x8214D068 = { end = 0x8214D0A0 }
0x8214D0A0 = { end = 0x8214D0D4 }  # 4th method; must stay separate (called via vtable)
# C++ this-adjustor thunks (addi r3,r3,-N ; b method) referenced from vtables
0x8213DE80 = { size = 0x08 }
0x821488A0 = { size = 0x08 }
0x821488A8 = { size = 0x08 }
0x821498D0 = { size = 0x08 }
0x8214AB28 = { size = 0x08 }
0x8214AB30 = { size = 0x08 }
0x8214AB40 = { size = 0x08 }
0x8214AB48 = { size = 0x08 }
0x8214AB58 = { size = 0x08 }
0x8214AB78 = { size = 0x08 }
0x8214AB88 = { size = 0x08 }

# 2D UI renderer (sub_820A2D10). The UI is authored at 640x480; for 16:9 the game
# multiplies x by 0.75 and adds 106.67 to centre it. The hook recomputes both for
# the real aspect ratio so menus, HUD and arrows keep their shape on ultrawide.
[[midasm_hook]]
address = 0x820A3054
name = "BbrUiTransformHook"
registers = ["f31", "f30", "r9"]

# Same renderer: vertex shader constants vScale.x (f0 at 0x820A2DF4, 1.5/640 for 16:9)
# and vOffset.x (loaded at 0x820A2E44, -0.75 for 16:9) - this is what positions the quads.
[[midasm_hook]]
address = 0x820A2DF4
name = "BbrUiScaleXHook"
registers = ["f0"]

[[midasm_hook]]
address = 0x820A2E44
name = "BbrUiOffsetXHook"
registers = ["f0"]
after_instruction = true

[[midasm_hook]]
address = 0x8208B6B4
name = "BbrUiWidgetHook"
registers = ["r3"]

[[midasm_hook]]
address = 0x8206A844
name = "BbrArrowAspectHook"
registers = ["f0"]

# Arrow placement (sub_8206A328): eased (rocket) and linear branches meet here with
# f30 = flown/flight, f31 = fraction across, f11 = fraction upwards (Rocket Acceleration).
[[midasm_hook]]
address = 0x8206A418
name = "BbrArrowEaseHook"
registers = ["f30", "f31", "f11"]

# Same function, where both branches meet again with the rocket's new position at r1+80
# (x, y, z) just before it is written to the rocket (Horizontal Drift).
[[midasm_hook]]
address = 0x8206A4C8
name = "BbrArrowDriftHook"
registers = ["r31", "r1"]

[[midasm_hook]]
address = 0x8206A874
name = "BbrArrowIconHook"
registers = ["r31", "r1"]

[[midasm_hook]]
address = 0x8206C7A4
name = "BbrParticleCountHook"
registers = ["r3", "r25"]

[[midasm_hook]]
address = 0x8213E490
name = "BbrAudioFrameHook"
registers = ["r4"]
